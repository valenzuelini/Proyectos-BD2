services:
  pgvector:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: proyectobd2
      POSTGRES_PASSWORD: proyectobd2
      POSTGRES_DB: vectores
    ports: ["5432:5432"]
    volumes: [pg_data:/var/lib/postgresql/data]

  qdrant:
    image: qdrant/qdrant
    ports: ["6333:6333"]
    volumes: [qdrant_data:/qdrant/storage]

  chroma:
    image: chromadb/chroma
    ports: ["8000:8000"]
    volumes: [chroma_data:/data]

volumes:
  pg_data:
  qdrant_data:
  chroma_data: